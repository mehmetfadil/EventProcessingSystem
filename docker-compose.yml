services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: event_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: event_sqlserver
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Pass123"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "YourStrong!Pass123" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  ingestion-api:
    build:
      context: .
      dockerfile: EventProcessing.IngestionApi/Dockerfile
    container_name: event_ingestion_api
    ports:
      - "5084:5084"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=EventProcessingDb;User=sa;Password=YourStrong!Pass123;TrustServerCertificate=True;
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=guest
      - RabbitMQ__Password=guest
      - RabbitMQ__QueueName=transaction_events
    depends_on:
      rabbitmq:
        condition: service_healthy
      sqlserver:
        condition: service_healthy

  aggregation-service:
    build:
      context: .
      dockerfile: EventProcessing.AggregationService/Dockerfile
    container_name: event_aggregation_service
    ports:
      - "5094:5094"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=EventProcessingDb;User=sa;Password=YourStrong!Pass123;TrustServerCertificate=True;
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__UserName=guest
      - RabbitMQ__Password=guest
      - RabbitMQ__QueueName=transaction_events
    depends_on:
      rabbitmq:
        condition: service_healthy
      sqlserver:
        condition: service_healthy

  unit-tests:
    build:
      context: .
      dockerfile: EventProcessing.UnitTests/Dockerfile
    container_name: event_unit_tests
    profiles:
      - test
    networks:
      - default

  integration-tests:
    build:
      context: .
      dockerfile: EventProcessing.IntegrationTests/Dockerfile
    container_name: event_integration_tests
    profiles:
      - test
    environment:
      - TEST_CONNECTION_STRING=Server=sqlserver;Database=EventProcessingIntegrationTestDb;User Id=sa;Password=YourStrong!Pass123;TrustServerCertificate=True;
    depends_on:
      rabbitmq:
        condition: service_healthy
      sqlserver:
        condition: service_healthy
    networks:
      - default

volumes:
  rabbitmq_data:
  sqlserver_data:
